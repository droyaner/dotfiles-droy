repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.9.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        exclude: (\.zshrc|\.p10k\.zsh)$ # ShellCheck unterstützt kein Zsh

  - repo: local
    hooks:
      - id: zsh-syntax-check
        name: Zsh Syntax Check
        entry: zsh -n
        language: system
        files: \.zshrc$|\.zsh$

      - id: nvim-headless-check
        name: Neovim Headless Init Check
        entry: bash -c 'nvim --headless -u "$PWD/.config/nvim/init.lua" -i NONE -n "+qa!"'
        language: system
        pass_filenames: false
        always_run: true

      - id: nvim-healthcheck
        name: Neovim Headless Health Check
        entry: bash -c 'nvim --headless -u "$PWD/.config/nvim/init.lua" -i NONE -n "+checkhealth" "+wqall!"'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/JohnnyMorganz/stylua
    rev: v0.20.0
    hooks:
      - id: stylua
        # Konfiguriere stylua hier oder in stylua.toml
